<svg width="1200" height="1600" xmlns="http://www.w3.org/2000/svg">
  <!-- Background Gradient -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Main Background -->
  <rect width="1200" height="1600" fill="url(#grad1)"/>

  <!-- White Container -->
  <rect x="50" y="40" width="1100" height="1520" fill="white" rx="30"/>

  <!-- Header Section -->
  <rect x="50" y="40" width="1100" height="280" fill="url(#grad2)" rx="30"/>

  <!-- Gold Border Line -->
  <rect x="50" y="310" width="1100" height="8" fill="#f39c12"/>

  <!-- Header Content -->
  <text x="600" y="140" font-size="72" font-weight="bold" text-anchor="middle" fill="white" font-family="Arial">
    🚀 الإتقان
  </text>

  <text x="600" y="200" font-size="48" text-anchor="middle" fill="#f0f0f0" font-family="Arial">
    ALETOQAN MOBILE
  </text>

  <text x="600" y="260" font-size="36" text-anchor="middle" fill="white" font-family="Arial">
    انضم إلى فريق التميز
  </text>

  <!-- Section 1: Jobs Title -->
  <text x="120" y="410" font-size="44" font-weight="bold" fill="#667eea" font-family="Arial">
    💼 الوظائف المتاحة
  </text>

  <!-- Gold Underline -->
  <rect x="120" y="420" width="320" height="4" fill="#f39c12"/>

  <!-- Job Cards -->
  <!-- Card 1 -->
  <rect x="100" y="480" width="300" height="220" fill="#f0f2ff" stroke="#667eea" stroke-width="2" rx="12"/>
  <text x="250" y="530" font-size="32" text-anchor="middle" fill="#667eea" font-family="Arial" font-weight="bold">📞</text>
  <text x="250" y="570" font-size="28" text-anchor="middle" fill="#667eea" font-family="Arial" font-weight="bold">خدمة العملاء</text>
  <text x="250" y="610" font-size="18" text-anchor="middle" fill="#666" font-family="Arial">كن الوجه الودود</text>
  <text x="250" y="635" font-size="18" text-anchor="middle" fill="#666" font-family="Arial">لشركتنا</text>

  <!-- Card 2 -->
  <rect x="450" y="480" width="300" height="220" fill="#f0f2ff" stroke="#667eea" stroke-width="2" rx="12"/>
  <text x="600" y="530" font-size="32" text-anchor="middle" fill="#667eea" font-family="Arial" font-weight="bold">🔧</text>
  <text x="600" y="570" font-size="28" text-anchor="middle" fill="#667eea" font-family="Arial" font-weight="bold">صيانة الأجهزة</text>
  <text x="600" y="610" font-size="18" text-anchor="middle" fill="#666" font-family="Arial">تقني متخصص</text>
  <text x="600" y="635" font-size="18" text-anchor="middle" fill="#666" font-family="Arial">وماهر</text>

  <!-- Card 3 -->
  <rect x="800" y="480" width="300" height="220" fill="#f0f2ff" stroke="#667eea" stroke-width="2" rx="12"/>
  <text x="950" y="530" font-size="32" text-anchor="middle" fill="#667eea" font-family="Arial" font-weight="bold">💰</text>
  <text x="950" y="570" font-size="28" text-anchor="middle" fill="#667eea" font-family="Arial" font-weight="bold">موظفو المبيعات</text>
  <text x="950" y="610" font-size="18" text-anchor="middle" fill="#666" font-family="Arial">بع بثقة</text>
  <text x="950" y="635" font-size="18" text-anchor="middle" fill="#666" font-family="Arial">واحترافية</text>

  <!-- Section 2: Requirements -->
  <text x="120" y="770" font-size="44" font-weight="bold" fill="#667eea" font-family="Arial">
    📋 المتطلبات الأساسية
  </text>

  <!-- Gold Underline -->
  <rect x="120" y="780" width="380" height="4" fill="#f39c12"/>

  <!-- Requirements Box -->
  <rect x="100" y="830" width="1000" height="280" fill="#f8f9fa" rx="12"/>

  <!-- Requirements Text -->
  <circle cx="140" cy="870" r="8" fill="#f39c12"/>
  <text x="170" y="880" font-size="20" fill="#333" font-family="Arial">خبرة أو قابلية للتعلم في استخدام منظومة فينكس</text>

  <circle cx="140" cy="930" r="8" fill="#f39c12"/>
  <text x="170" y="940" font-size="20" fill="#333" font-family="Arial">مهارات اتصال قوية وحس خدمة عملاء ممتاز</text>

  <circle cx="140" cy="990" r="8" fill="#f39c12"/>
  <text x="170" y="1000" font-size="20" fill="#333" font-family="Arial">القدرة على العمل ضمن فريق متعاون</text>

  <circle cx="140" cy="1050" r="8" fill="#f39c12"/>
  <text x="170" y="1060" font-size="20" fill="#333" font-family="Arial">الحماس والرغبة في التطور المهني</text>

  <circle cx="140" cy="1070" r="8" fill="#f39c12"/>
  <text x="170" y="1080" font-size="20" fill="#333" font-family="Arial">الالتزام والمسؤولية في العمل</text>

  <!-- Section 3: Benefits -->
  <text x="120" y="1170" font-size="44" font-weight="bold" fill="#667eea" font-family="Arial">
    🎁 مزايا العمل
  </text>

  <!-- Gold Underline -->
  <rect x="120" y="1180" width="280" height="4" fill="#f39c12"/>

  <!-- Benefits Box -->
  <rect x="100" y="1230" width="1000" height="200" fill="#f8f9fa" rx="12"/>

  <!-- Benefits Text -->
  <circle cx="140" cy="1260" r="8" fill="#f39c12"/>
  <text x="170" y="1270" font-size="20" fill="#333" font-family="Arial">بيئة عمل مربحة وآمنة • فريق متعاون وداعم</text>

  <circle cx="140" cy="1310" r="8" fill="#f39c12"/>
  <text x="170" y="1320" font-size="20" fill="#333" font-family="Arial">فرص واضحة للتطور والترقي • رواتب تنافسية</text>

  <circle cx="140" cy="1360" r="8" fill="#f39c12"/>
  <text x="170" y="1370" font-size="20" fill="#333" font-family="Arial">تدريب مستمر على أحدث التقنيات</text>

  <!-- Location Info -->
  <rect x="100" y="1470" width="1000" height="100" fill="#ecf0f1" rx="12"/>
  <text x="130" y="1510" font-size="24" font-weight="bold" fill="#667eea" font-family="Arial">📍 الموقع:</text>
  <text x="130" y="1550" font-size="20" fill="#333" font-family="Arial">شارع المدار - طرابلس، ليبيا | الفرع الرئيسي</text>

  <!-- Contact Section -->
  <rect x="50" y="1600" width="1100" height="0" fill="url(#grad2)"/>

  <!-- Footer -->
  <rect x="50" y="1560" width="1100" height="40" fill="#2c3e50"/>
  <text x="600" y="1590" font-size="16" text-anchor="middle" fill="white" font-family="Arial">
    © 2024 الإتقان للنقول | جودة الخدمة أولويتنا
  </text>

</svg>